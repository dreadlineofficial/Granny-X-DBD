<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Granny x DBD</title><style>
@font-face{font-family:Barlow;src:url(barlow-cond-600.woff2);font-display:swap}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050304;user-select:none;-webkit-app-region:drag;cursor:default}
.art{position:absolute;inset:0;background:url(art.jpg) center/cover no-repeat;animation:in .6s ease-out both}
@keyframes in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.flick{position:absolute;inset:0;background:radial-gradient(ellipse 40% 60% at 80% 45%,rgba(160,12,12,.16),transparent 70%);animation:fl 3.2s infinite steps(1)}
@keyframes fl{0%,100%{opacity:1}47%{opacity:.35}49%{opacity:1}83%{opacity:.6}85%{opacity:1}}
.msg{position:absolute;left:36px;bottom:9px;right:120px;font:15px/1 Barlow,"Segoe UI",Tahoma,sans-serif;color:#cfc6c0;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{color:#d61f1f;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ver{position:absolute;right:16px;bottom:9px;font:15px/1 Barlow,"Segoe UI",Tahoma,sans-serif;color:#7c726d;letter-spacing:1.5px}
.track{position:absolute;left:0;right:0;bottom:34px;height:2px;background:rgba(214,31,31,.18);overflow:hidden}
.run{position:absolute;top:0;bottom:0;width:28%;background:linear-gradient(90deg,transparent,#d61f1f,transparent);animation:run 1.6s ease-in-out infinite}
@keyframes run{from{left:-30%}to{left:102%}}
.hint{position:absolute;left:36px;bottom:44px;font:13px/1.2 Barlow,"Segoe UI",Tahoma,sans-serif;color:#9a8f89;letter-spacing:1px;opacity:0;transition:opacity .6s}
.hint.on{opacity:1}
</style></head><body>
<div class="art"></div><div class="flick"></div>
<div class="track"><div class="run"></div></div>
<div class="msg"><span class="dot">&#9679;</span>&nbsp; <span id="m">Waking Granny up&hellip;</span></div>
<div class="ver" id="v"></div>
<div class="hint" id="h"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('v').textContent = q.get('v') ? 'v' + q.get('v') : '';
window.setMsg = (m, h) => { if (m) document.getElementById('m').textContent = m; const e = document.getElementById('h'); if (h != null) { e.textContent = h; e.classList.toggle('on', !!h); } };
if (q.get('m')) setMsg(q.get('m'));
</script></body></html>
